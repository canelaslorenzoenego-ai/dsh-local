<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="/web/xterm.css">
<style>
  html, body { margin:0; height:100%; background:#0B0E14; color:#E8EDF7; font-family:monospace; }
  #term { width:100%; height:100%; }
  #offline { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
             flex-direction:column; gap:10px; background:#0B0E14; z-index:10; text-align:center; padding:24px; }
  #offline h2 { color:#E8EDF7; margin:0; font-size:18px; }
  #offline p { color:#8B96AC; margin:0; font-size:13px; }
</style>
</head>
<body>
<div id="term"></div>
<div id="offline">
  <h2>Terminal server is offline</h2>
  <p>Start the Proxy Gateway from the Dashboard tab, then reopen Terminal.</p>
</div>
<script src="/web/xterm.js"></script>
<script>
  var term = new Terminal({
    cursorBlink: true,
    fontSize: 13,
    fontFamily: 'monospace',
    theme: { background:'#0B0E14', foreground:'#E8EDF7', cursor:'#4D6BFE',
             selectionBackground:'rgba(77,107,254,0.35)' }
  });
  term.open(document.getElementById('term'));

  // session token: taken from the link you opened (?token=… or #token=…)
  var TOKEN = new URLSearchParams(location.search).get('token')
    || (location.hash.match(/token=([^&]+)/) || [])[1] || '';
  function withToken(path) {
    if (!TOKEN) return path;
    return path + (path.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);
  }

  var seq = 0;
  var DELAY_OK = 180, DELAY_MAX = 3000, delay = DELAY_OK, locked = false;
  function pump() {
    if (locked) return; // token rejected — stop hammering the server
    fetch(withToken('/stream?seq=' + seq)).then(function(r){
      if (r.status === 401) throw new Error('locked');
      return r.json();
    }).then(function(j){
      if (j.data) term.write(j.data);
      seq = j.seq;
      delay = DELAY_OK; // healthy — back to fast polling
      document.getElementById('offline').style.display = 'none';
    }).catch(function(e){
      if (e && e.message === 'locked') { locked = true; }
      // exponential backoff while the server is down: 180ms → 360 → 720 → 1.4s → 3s
      delay = Math.min(delay * 2, DELAY_MAX);
      document.getElementById('offline').style.display = 'flex';
    });
  }
  (function loop(){ pump(); setTimeout(loop, delay); })();

  term.onData(function(d){
    fetch(withToken('/input'), { method:'POST', body: d });
  });
</script>
</body>
</html>
